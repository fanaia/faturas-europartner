name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Verify backend runtime dependencies
        run: npm run check:dependencies --prefix backend
      - name: Backend static checks
        run: npm run check --prefix backend
      - name: Backend unit tests
        run: npm test --prefix backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Frontend manifest checks
        run: npm run check --prefix frontend
      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend
      - name: Frontend build
        run: npm run build --prefix frontend
