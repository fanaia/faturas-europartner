name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Verify backend runtime dependencies
        run: npm run check:dependencies --prefix backend
      - name: Install frontend dependencies
        run: npm install --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Static checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Frontend build
        run: npm run build --prefix frontend
